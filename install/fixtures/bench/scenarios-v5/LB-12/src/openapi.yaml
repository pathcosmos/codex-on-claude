openapi: 3.0.0
info:
  title: Order API
  version: 1.0.0
paths:
  /orders:
    get:
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    status: {type: string, enum: [pending, completed, failed]}
                    total: {type: number}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items: {type: array}
                customer_id: {type: string}
              required: [items]
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
components:
  schemas:
    Order:
      type: object
      properties:
        id: {type: string}
        status: {type: string}
        total: {type: number}
        created_at: {type: string, format: date-time}
        items: {type: array}